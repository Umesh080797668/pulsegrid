spring.application.name=enterprise-service
# Server Configuration
server.port=${ENTERPRISE_SERVICE_PORT:8080}
server.servlet.context-path=/api/v1/enterprise

# Database Configuration
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/pulsegrid}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# H2 (for testing)
spring.h2.console.enabled=false

# JPA Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# Actuator Configuration
management.endpoints.web.exposure.include=health,metrics,info,prometheus
management.endpoint.health.show-details=when-authorized
management.endpoint.health.show-components=when-authorized
management.endpoints.web.base-path=/api/v1/enterprise/actuator

# Security
spring.security.filter.dispatcher-types=REQUEST,ERROR,FORWARD
security.jwt.secret=${JWT_SECRET:pulsegrid-dev-secret-key}
security.jwt.expiration=${JWT_EXPIRATION:900000}

# Stripe Configuration
stripe.api.key=${STRIPE_API_KEY:}

# Logging
logging.level.root=INFO
logging.level.io.pulsegrid=DEBUG