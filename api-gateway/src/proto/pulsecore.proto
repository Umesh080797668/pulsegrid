
syntax = "proto3";

package pulsecore;

// Gateway imports the canonical pulsecore definitions from the core package.
// Keep this file as a small wrapper to version-lock the shared proto dependency.
import "../../../core/core-proto/proto/pulsecore.proto";

// No duplicate definitions here — gateway only wraps the shared proto.

message EventMetricsRequest {
  string workspace_id = 1;
  string interval = 2; // hour|day|week
  int32 limit = 3;
}

message EventMetricPoint {
  string bucket = 1;
  int64 count = 2;
}

message EventMetricsResponse {
  repeated EventMetricPoint data = 1;
}
