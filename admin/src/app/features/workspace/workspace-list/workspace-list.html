<div class="workspace-list">
	<div class="toolbar">
		<mat-form-field appearance="outline" class="search">
			<mat-icon matPrefix>search</mat-icon>
			<input matInput placeholder="Search workspaces" (input)="applyFilter($event)" />
		</mat-form-field>
		<button mat-flat-button color="primary" (click)="openCreate()">Create Workspace</button>
	</div>

	<div class="table-wrap">
		<table mat-table [dataSource]="dataSource" class="mat-elevation-z2">

			<!-- Name Column -->
			<ng-container matColumnDef="name">
				<th mat-header-cell *matHeaderCellDef>Name</th>
				<td mat-cell *matCellDef="let row">{{ row.name }}</td>
			</ng-container>

			<!-- ID Column -->
			<ng-container matColumnDef="id">
				<th mat-header-cell *matHeaderCellDef>ID</th>
				<td mat-cell *matCellDef="let row">{{ row.id }}</td>
			</ng-container>

			<!-- Owner Column -->
			<ng-container matColumnDef="owner">
				<th mat-header-cell *matHeaderCellDef>Owner</th>
				<td mat-cell *matCellDef="let row">{{ row.ownerName || row.owner }}</td>
			</ng-container>

			<!-- Created At Column -->
			<ng-container matColumnDef="createdAt">
				<th mat-header-cell *matHeaderCellDef>Created</th>
				<td mat-cell *matCellDef="let row">{{ row.createdAt | date:'medium' }}</td>
			</ng-container>

			<!-- Actions Column -->
			<ng-container matColumnDef="actions">
				<th mat-header-cell *matHeaderCellDef>Actions</th>
				<td mat-cell *matCellDef="let row">
					<button mat-icon-button color="primary" (click)="openEdit(row)">
						<mat-icon>edit</mat-icon>
					</button>
					<button mat-icon-button color="warn" (click)="deleteWorkspace(row.id)">
						<mat-icon>delete</mat-icon>
					</button>
				</td>
			</ng-container>

			<tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
			<tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
		</table>

		<mat-paginator [pageSizeOptions]="[5, 10, 25]" showFirstLastButtons></mat-paginator>
	</div>

	<div *ngIf="loading" class="loading-overlay">
		<mat-progress-spinner mode="indeterminate"></mat-progress-spinner>
	</div>
</div>
