spring.application.name=enterprise
server.port=8081

spring.datasource.url=${ENTERPRISE_DATABASE_URL:jdbc:postgresql://localhost:5432/pulsegrid_enterprise}
spring.datasource.username=${ENTERPRISE_DATABASE_USERNAME:pulsegrid}
spring.datasource.password=${ENTERPRISE_DATABASE_PASSWORD:pulsegrid}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_schema=${ENTERPRISE_DEFAULT_SCHEMA:public}

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=when_authorized

spring.security.oauth2.client.registration.enterprise.provider=enterprise
spring.security.oauth2.client.registration.enterprise.client-id=${ENTERPRISE_OIDC_CLIENT_ID:enterprise-client}
spring.security.oauth2.client.registration.enterprise.client-secret=${ENTERPRISE_OIDC_CLIENT_SECRET:enterprise-secret}
spring.security.oauth2.client.registration.enterprise.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.enterprise.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
spring.security.oauth2.client.provider.enterprise.authorization-uri=${ENTERPRISE_OIDC_AUTHORIZATION_URI:https://idp.example.com/oauth2/authorize}
spring.security.oauth2.client.provider.enterprise.token-uri=${ENTERPRISE_OIDC_TOKEN_URI:https://idp.example.com/oauth2/token}
spring.security.oauth2.client.provider.enterprise.user-info-uri=${ENTERPRISE_OIDC_USERINFO_URI:https://idp.example.com/oauth2/userinfo}
spring.security.oauth2.client.provider.enterprise.user-name-attribute=sub

spring.security.saml2.relyingparty.registration.enterprise.identityprovider.entity-id=${ENTERPRISE_SAML_ENTITY_ID:https://idp.example.com/saml/entity}
spring.security.saml2.relyingparty.registration.enterprise.identityprovider.web-sso-url=${ENTERPRISE_SAML_SSO_URL:https://idp.example.com/saml/sso}
spring.security.saml2.relyingparty.registration.enterprise.identityprovider.verification.credentials[0].certificate-location=${ENTERPRISE_SAML_CERTIFICATE:classpath:enterprise-idp.crt}spring.application.name=enterprise
