<section class="audit-log-viewer">
  <h2>Audit Log Viewer</h2>

  <app-audit-filter
    (apply)="onFilterApply($event)"
    (clear)="onFilterClear()">
  </app-audit-filter>

  <app-audit-export (export)="onExport($event)"></app-audit-export>

  <table mat-table [dataSource]="dataSource" class="mat-elevation-z2 full-width">
    <ng-container matColumnDef="timestamp">
      <th mat-header-cell *matHeaderCellDef>Timestamp</th>
      <td mat-cell *matCellDef="let row">{{ row.timestamp | date:'medium' }}</td>
    </ng-container>

    <ng-container matColumnDef="user">
      <th mat-header-cell *matHeaderCellDef>User</th>
      <td mat-cell *matCellDef="let row">{{ row.user }}</td>
    </ng-container>

    <ng-container matColumnDef="action">
      <th mat-header-cell *matHeaderCellDef>Action</th>
      <td mat-cell *matCellDef="let row">{{ row.action }}</td>
    </ng-container>

    <ng-container matColumnDef="resource">
      <th mat-header-cell *matHeaderCellDef>Resource</th>
      <td mat-cell *matCellDef="let row">{{ row.resource }}</td>
    </ng-container>

    <ng-container matColumnDef="details">
      <th mat-header-cell *matHeaderCellDef>Details</th>
      <td mat-cell *matCellDef="let row">{{ row.details }}</td>
    </ng-container>

    <ng-container matColumnDef="status">
      <th mat-header-cell *matHeaderCellDef>Status</th>
      <td mat-cell *matCellDef="let row">{{ row.status }}</td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
  </table>

  <mat-paginator
    [length]="(pagination$ | async)?.total || 0"
    [pageSize]="25"
    [pageSizeOptions]="[10, 25, 50]"
    (page)="onPageChange($event)">
  </mat-paginator>

  <div *ngIf="loading$ | async" class="loading-overlay">
    <mat-progress-spinner mode="indeterminate"></mat-progress-spinner>
  </div>
</section>
