<section class="subscription-manager">
	<h2>Subscription Management</h2>

	<div class="cards" *ngIf="subscriptions$ | async as subscriptions">
		<article class="card" *ngFor="let s of subscriptions">
			<div class="meta">
				<h3>{{ s.workspaceName || s.workspaceId || s.id }}</h3>
				<p>Status: {{ s.status || 'active' }}</p>
			</div>

			<mat-form-field appearance="fill" class="plan-input">
				<mat-label>Plan</mat-label>
				<input matInput [(ngModel)]="draftPlans[s.id]" [placeholder]="s.plan || 'starter'" />
			</mat-form-field>

			<div class="actions">
				<button mat-stroked-button color="primary" (click)="updatePlan(s)">Update</button>
				<button mat-flat-button color="warn" (click)="cancel(s.id)">Cancel</button>
			</div>
		</article>
	</div>
</section>
