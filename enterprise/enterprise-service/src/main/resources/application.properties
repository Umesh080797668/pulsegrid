spring.application.name=enterprise-service
# Server Configuration
server.port=${ENTERPRISE_SERVICE_PORT:8080}
server.servlet.context-path=/api/v1/enterprise

# Database Configuration
spring.datasource.url=${DATABASE_URL:jdbc:h2:file:./data/enterprise;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}

# H2 (for testing)
spring.h2.console.enabled=false

# JPA Configuration
spring.jpa.database-platform=${JPA_DATABASE_PLATFORM:org.hibernate.dialect.H2Dialect}
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# Actuator Configuration
management.endpoints.web.exposure.include=health,metrics,info,prometheus
management.endpoint.health.show-details=when-authorized
management.endpoint.health.show-components=when-authorized
management.endpoints.web.base-path=/api/v1/enterprise/actuator

# Security
spring.security.filter.dispatcher-types=REQUEST,ERROR,FORWARD

# Logging
logging.level.root=INFO
logging.level.io.pulsegrid=DEBUG