<div class="user-manager">
	<div class="toolbar">
		<mat-form-field appearance="outline" class="search">
			<mat-icon matPrefix>search</mat-icon>
			<input matInput placeholder="Search users" (input)="applyFilter($event)" />
		</mat-form-field>
		<button mat-flat-button color="primary" (click)="openCreateUser()">Create User</button>
		<button mat-stroked-button color="primary" (click)="openCreateRole()">Create Role</button>
	</div>

	<table mat-table [dataSource]="dataSource" class="mat-elevation-z2 full-width">
		<ng-container matColumnDef="id">
			<th mat-header-cell *matHeaderCellDef>ID</th>
			<td mat-cell *matCellDef="let row">{{ row.id }}</td>
		</ng-container>

		<ng-container matColumnDef="name">
			<th mat-header-cell *matHeaderCellDef>Name</th>
			<td mat-cell *matCellDef="let row">{{ row.name || row.fullName }}</td>
		</ng-container>

		<ng-container matColumnDef="email">
			<th mat-header-cell *matHeaderCellDef>Email</th>
			<td mat-cell *matCellDef="let row">{{ row.email }}</td>
		</ng-container>

		<ng-container matColumnDef="roles">
			<th mat-header-cell *matHeaderCellDef>Roles</th>
			<td mat-cell *matCellDef="let row">{{ (row.roles || []).join(', ') }}</td>
		</ng-container>

		<ng-container matColumnDef="actions">
			<th mat-header-cell *matHeaderCellDef>Actions</th>
			<td mat-cell *matCellDef="let row">
				<button mat-icon-button color="primary" (click)="openEditUser(row)">
					<mat-icon>edit</mat-icon>
				</button>
				<button mat-icon-button color="warn" (click)="deleteUser(row.id)">
					<mat-icon>delete</mat-icon>
				</button>
			</td>
		</ng-container>

		<tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
		<tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
	</table>

	<mat-paginator
		[length]="(pagination$ | async)?.total || 0"
		[pageSize]="25"
		[pageSizeOptions]="[10, 25, 50]"
		(page)="onPageChange($event)">
	</mat-paginator>

	<section class="role-section">
		<h3>Roles</h3>
		<div class="roles" *ngIf="roles$ | async as roles">
			<div class="role-chip" *ngFor="let role of roles">
				<div>
					<strong>{{ role.name }}</strong>
					<p>{{ role.description }}</p>
				</div>
				<div class="actions">
					<button mat-icon-button color="primary" (click)="openEditRole(role)">
						<mat-icon>edit</mat-icon>
					</button>
					<button mat-icon-button color="warn" (click)="deleteRole(role.id)">
						<mat-icon>delete</mat-icon>
					</button>
				</div>
			</div>
		</div>
	</section>

	<div *ngIf="loading$ | async" class="loading-overlay">
		<mat-progress-spinner mode="indeterminate"></mat-progress-spinner>
	</div>
</div>
